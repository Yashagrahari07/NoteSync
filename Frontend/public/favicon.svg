          stroke-width="2.5" 
          stroke-linecap="round"/>
    <polyline points="10 9 9 9 8 9" 
              stroke="white" 
              stroke-width="2.5" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
  </g>
  
  <!-- Sparkles icon: h-3 w-3 (12px) at -top-0.5 -right-0.5 -->
